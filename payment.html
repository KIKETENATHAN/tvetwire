<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TvetPrime - Notes</title>

    <!-- Bootstrap CSS -->
    <link href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css" rel="stylesheet">
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>

    <style>
        .btn-gold {
            background-color: #FFD700;
            color: #000;
        }

        .btn-gold:hover {
            background-color: #17e64f;
            color: #000;
        }

        .card-title {
            color: #007bff; /* Bootstrap Blue */
        }

        .form-control {
            margin-bottom: 10px;
        }

        .centered-container {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
    </style>
</head>
<body class="bg-gray-100">

<div class="centered-container">
    <div class="card shadow-lg p-4 max-w-md">
        <h1 class="card-title text-center text-blue-500 text-2xl font-bold mb-4">Confirm Your Notes</h1>

        <!-- Notes Information -->
        <div class="form-group">
            <label for="chosen-note" class="text-blue-500">Chosen Note:</label>
            <input type="text" id="chosen-note" class="form-control border border-gray-300 rounded p-2" readonly>
        </div>

        <!-- WhatsApp Number Input -->
        <div class="form-group">
            <label for="whatsapp-number" class="text-blue-500">WhatsApp Number (optional):</label>
            <input type="text" id="whatsapp-number" class="form-control border border-gray-300 rounded p-2" placeholder="Enter your WhatsApp number">
        </div>

        <!-- Email Address Input -->
        <div class="form-group">
            <label for="email-address" class="text-blue-500">Email Address (optional):</label>
            <input type="email" id="email-address" class="form-control border border-gray-300 rounded p-2" placeholder="Enter your email address">
        </div>

        <!-- Phone Number Input for Payment -->
        <div class="form-group">
            <label for="payment-phone" class="text-blue-500">Phone Number for Payment:</label>
            <input type="text" id="payment-phone" class="form-control border border-gray-300 rounded p-2" placeholder="Enter the phone number for payment" required>
        </div>

        <!-- Payment Button -->
        <div class="text-center">
            <button id="pay-button" class="btn btn-gold btn-lg mt-2" onclick="startPayment()">Proceed to Payment</button>
        </div>

        <!-- Payment Status -->
        <div id="payment-status" class="text-center text-red-500 mt-3"></div>
    </div>
</div>

<!-- Bootstrap JS (optional for modal, etc.) -->
<script src="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.min.js"></script>

<script>
    // Function to get query parameter
    function getQueryParam(param) {
        const urlParams = new URLSearchParams(window.location.search);
        return urlParams.get(param);
    }

    // Show the selected note
    window.onload = function() {
        const selectedNote = getQueryParam('note');

        if (selectedNote) {
            document.getElementById('chosen-note').value = selectedNote;
        } else {
            document.getElementById('chosen-note').value = 'No notes selected. Please go back and choose a note.';
            document.getElementById('pay-button').disabled = true; // Disable the payment button if no note is selected
        }
    };

    function startPayment() {
        const note = document.getElementById('chosen-note').value;
        const whatsappNumber = document.getElementById('whatsapp-number').value;
        const emailAddress = document.getElementById('email-address').value;
        const paymentPhone = document.getElementById('payment-phone').value;

        // Validation
        if (!whatsappNumber && !emailAddress) {
            document.getElementById('payment-status').innerHTML = "Error: Please provide either WhatsApp number or email address for receiving the notes.";
            return;
        }
        if (!paymentPhone) {
            document.getElementById('payment-status').innerHTML = "Error: Please provide a phone number for payment.";
            return;
        }

        // Send the data to the backend to trigger STK Push
        fetch('process_payment.php', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json',
            },
            body: JSON.stringify({
                note: note,
                whatsappNumber: whatsappNumber,
                emailAddress: emailAddress,
                paymentPhone: paymentPhone
            }),
        })
        .then(response => response.json())
        .then(data => {
            if (data.status === 'success') {
                document.getElementById('payment-status').innerHTML = "Payment successful! Notes will be sent.";
                document.getElementById('payment-status').classList.remove('text-red-500');
                document.getElementById('payment-status').classList.add('text-green-500');
            } else {
                document.getElementById('payment-status').innerHTML = "Payment failed. Please try again.";
            }
        })
        .catch(error => {
            document.getElementById('payment-status').innerHTML = "Error processing payment.";
        });
    }
</script>

</body>
</html>
